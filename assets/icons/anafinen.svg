<?xml version="1.0" encoding="UTF-8"?>
<!-- ANAFINEN logo (48 px and up; anafinen-small.svg covers 16-32 px).
     Interlocked "A" and "N" sharing one vertical stem, sharp corners throughout. 256 x 256 grid,
     cap height 48..208, glyph box 32..224 (centered), stroke weight 24. The letters carry a
     result-contour color scale, blue at the baseline to red at the cap line. -->
<svg width="256" height="256" version="1.1" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17171C"/>
      <stop offset="1" stop-color="#0B0B0E"/>
    </linearGradient>
    <linearGradient id="contourGrad" x1="0" y1="208" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F5BFF"/>
      <stop offset="0.25" stop-color="#00C2FF"/>
      <stop offset="0.5" stop-color="#2EE06A"/>
      <stop offset="0.75" stop-color="#FFD21F"/>
      <stop offset="1" stop-color="#FF3B1F"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="254" height="254" rx="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <!-- A left leg, shared stem, A crossbar, N diagonal, N right stem. All sub-paths wind
       clockwise, so the nonzero fill rule draws their union. -->
  <path fill="url(#contourGrad)" d="
    M32 208 L124 48 L148 48 L148 54.41 L59.68 208 Z
    M124 48 H148 V208 H124 Z
    M80 140 H124 V164 H80 Z
    M124 48 H153 L224 208 H195 Z
    M200 48 H224 V208 H200 Z"/>
</svg>
